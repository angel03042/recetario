<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/style/receta.css">
    <script src="/public/js/receta.js" defer></script>
    <link rel="icon" type="image/png" href="/public/img_usuario/logo_restaurante.ico">
    <title>Document</title>
</head>
<body>
    <!-- Contenedor de la informacion de la receta -->
    <section id="section">
        <div class="buttons">
            <a href="/public/pages/usuario.html"><butto class="btn1">Volver</butto></a>
            <button id="buttonDeleteReceta" class="btn2">Eliminar</button>
        </div>
        <article>
            <img id="imagen" alt="">
            <div>
                <h1 id="titleReceta"></h1>
                <p id="ingredientesReceta"></p>
            </div>
            <div class="instrucciones">
                <h1>Instrucciones</h1>
                <p id="instruccionesReceta"></p>
            </div>
        </article>
    </section>
    <!-- Contenedor para confirmar el delete de la receta -->
    <div class="mostrar" id="confirmarDeleteReceta">
        <div class="delete_receta">
            <h2>Confirmar</h2>
            <div>
                <button id="deleteReceta" class="btnConfirmar">Aceptar</button>
                <button id="cancelarDelete" class="btnCancelar">Cancelar</button>
            </div>
        </div>
    </div>
</body>
</html>
