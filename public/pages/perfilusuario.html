<article class="pag_usuario">
    <div class="navegacion">
        <div class="perfil">
            <button>
                <img src="/public/img/Female Avatar (1).gif" alt="">
                <p>Angel B</p>
            </button>
            <img src="img_usuario/un logo color negro sin las letras y fondo blanco para un restaurante.png" alt="">
        </div>
        <div class="search">
            <img src="/public/img/search.png" alt="">
            <input type="text" name="text" placeholder="Buscar">
        </div>
        <div class="notification">
            <img class="notifi" src="/public/img/notification.gif" alt="">
            <button class="salir" id="cerrar_sesion"><img src="/public/img/log-out (1).png" alt="">Salir</button>
        </div>
        <img src="/public/img/log-out.png" alt="">
    </div>
    <div class="perfil_usuario">
        <div class="receta_editar">
            <img src="/public/img/Learn More.gif" alt="">
            <p class="editar_receta">Editar (Receta)</p>
        </div>
        <div class="datos_usuario">
            <div class="datos_informacion">
                <div>
                    <p>Tus Datos</p>
                    <div class="datos_input">
                        <div>
                            <label for="">Usuario</label>
                            <input class="usuario_editar" type="text">
                        </div>
                        <div>
                            <label for="">Password</label>
                            <div class="password">
                                <input id="passwordEditar" class="password_editar" type="password">
                                <img id="ocultar" src="/public/img/eye-closed.png" alt="">
                                <img id="mostrar" src="/public/img/eye.png" alt="" style="display: none;">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="datos_button">
                    <button class="btn1">Actualizar datos</button>
                    <button class="btn2">Borrar cuenta</button>
                </div>
            </div>
            <img src="/public/img/Register.gif" alt="">
        </div>
        <div class="reporte_error">
            <div class="reporte_contacto">
                <p class="reportar_bug">Reportar (Error o Problemas)</p>
                <p>Has tenido algun problema con nuestra app, contactanos y pronto lo resolveremos.</p>
                <form action="">
                    <textarea name="" id="" rows="12" required></textarea>
                    <button><img class="btn_enviar" src="/public/img/Paper Plane.gif" alt=""></button>
                </form>
            </div>
            <img src="/public/img/error.png" alt="">
        </div>
    </div>
 </article>
