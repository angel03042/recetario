<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/public/js/usuario.js" defer></script>
    <link rel="stylesheet" href="/public/style/usuario_style.css">
    <link rel="icon" type="image/png" href="/public/img_usuario/logo_restaurante.ico">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="/public/js/fetchAPI/cargarContenido.js" defer></script>
    <title>Recetapp</title>
</head>
<body x-data="{ category: 'entrada' }">

    <!-- Navegacion -->
    <main id="navegacion"></main>
    <section>
        <!--Todos los Productos -->
        <main x-show="category === 'entrada'" id="todos_los_productos"></main>
        <!-- Categorias (recetas) -->
        <main x-show="category === 'categoria'" id="categorias"></main>
        <!-- Filtar recetas por categorias -->
        <main x-show="category === 'cargarRecetas'" id="cargarRecetas"></main>
        <!-- Añadir recetas -->
        <main x-show="category === 'agregar_receta'" id="anadirRecetas"></main>
        <!-- USUARIO -->
        <main x-show="category === 'usuario'" id="perfilUsuario"></main>
    </section>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarContenido("navegacion", "/public/pages/navegacion.html");
            cargarContenido("todos_los_productos", "/public/pages/Todos_los_productos.html");
            cargarContenido("categorias", "/public/pages/categorias.html");
            cargarContenido("cargarRecetas", "/public/pages/cargarRecetas.html");
            cargarContenido("anadirRecetas", "/public/pages/anadir_recetas.html");
            cargarContenido("perfilUsuario", "/public/pages/perfilusuario.html");
        });
    </script>
</body>
</html>
